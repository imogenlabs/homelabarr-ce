---
services:
  rsnapshot:
    hostname: "rsnapshot"
    container_name: "rsnapshot"
    environment:
      - "PGID=${ID}"
      - "PUID=${ID}"
      - "TZ=${TZ}"
    image: "lscr.io/linuxserver/rsnapshot:version-1.4.5-r0"
    restart: "${RESTARTAPP}"
    networks:
      - ${DOCKERNETWORK}
    volumes:
      - "${APPFOLDER}/rsnapshot:/config:rw"
      - "/mnt/snapshots:/.snapshots"
      - "${APPFOLDER}:/data:ro"
      - "/etc/localtime:/etc/localtime:ro"
    labels:
      - "dockupdater.enable=true"

---
services:
  watchtower:
    hostname: "watchtower"
    container_name: "watchtower"
    image: "ghcr.io/containrrr/watchtower:1.7.1"
    environment:
      - "PUID=${ID}"
      - "PGID=${ID}"
      - "TZ=${TZ}"
      - "WATCHTOWER_CLEANUP=${WATCHTOWER_CLEANUP:-true}"
      - "WATCHTOWER_REMOVE_VOLUMES=${WATCHTOWER_REMOVE_VOLUMES:-false}"
      - "WATCHTOWER_INCLUDE_STOPPED=${WATCHTOWER_INCLUDE_STOPPED:-false}"
      - "WATCHTOWER_NO_STARTUP_MESSAGE=${WATCHTOWER_NO_STARTUP_MESSAGE:-true}"
      - "WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-86400}"
      - "WATCHTOWER_LABEL_ENABLE=${WATCHTOWER_LABEL_ENABLE:-false}"
      - "WATCHTOWER_ROLLING_RESTART=${WATCHTOWER_ROLLING_RESTART:-false}"
      - "WATCHTOWER_TIMEOUT=${WATCHTOWER_TIMEOUT:-10s}"
    restart: "${RESTARTAPP}"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    security_opt:
      - "${SECURITYOPS}:${SECURITYOPSSET}"
    networks:
      - ${DOCKERNETWORK}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
networks:
  proxy:
    driver: bridge
    external: true

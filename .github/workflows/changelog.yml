name: Generate changelog

# Adds a release's notes to the published wiki changelog at
# https://wiki.homelabarr.com/install/changelog/
#
# It used to truncate that page and re-write it from the latest release alone. When
# v2.3.0 generated empty notes it opened PR #458 — 63 lines removed, 2 added, a live
# public page reduced to a header — and reported success (HLCE-316). The page is now
# appended to, never rebuilt, and an empty or degenerate generator result fails the
# run instead of publishing.

on:
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      to_tag:
        description: 'Release tag to document (e.g. v2.3.0)'
        required: true
        type: string
      from_tag:
        description: 'Previous tag to diff from. Leave blank to auto-detect. Setting it equal to to_tag yields empty notes, which must fail the run.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  changelog-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Changelog
      id: github_release
      uses: mikepenz/release-changelog-builder-action@c9bcd8238b6f41e05561348339429d360b1c0247  # v6
      with:
        configuration: ".github/changelog-config.json"
        fromTag: ${{ inputs.from_tag }}
        toTag: ${{ inputs.to_tag || github.event.release.tag_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Asked of the release itself rather than taken from the event, which carries no
    # published_at on a manual run — a backfill would otherwise date every historical
    # release as today.
    - name: Resolve release date
      id: reldate
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.to_tag || github.event.release.tag_name }}
      run: |
        set -uo pipefail
        published=$(gh release view "$TAG" --json publishedAt --jq .publishedAt 2>/dev/null || true)
        [ -z "$published" ] && published=$(git log -1 --format=%aI "$TAG" 2>/dev/null || true)
        echo "date=$published" >> "$GITHUB_OUTPUT"
        echo "Dating $TAG as ${published:-<unknown, will fall back to today>}"

    # Validates the generated notes and inserts them. Refuses to publish anything it
    # cannot vouch for, and cannot remove existing content. Values go through env
    # rather than ${{ }} interpolation so release text can never become shell.
    - name: Update wiki changelog
      env:
        CHANGELOG_BODY: ${{ steps.github_release.outputs.changelog }}
        RELEASE_TAG: ${{ inputs.to_tag || github.event.release.tag_name }}
        RELEASE_DATE: ${{ steps.reldate.outputs.date }}
      run: node scripts/update-wiki-changelog.mjs

    - name: Create PR with changelog
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.to_tag || github.event.release.tag_name }}
      run: |
        set -euo pipefail
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add wiki/docs/install/changelog.md
        if git diff --staged --quiet; then
          echo "Changelog already up to date; no PR needed."
          exit 0
        fi

        # Second, independent guard. The merge script cannot remove lines, so if git
        # sees deletions here something upstream of it has gone wrong — stop rather
        # than open another #458.
        deletions=$(git diff --staged --numstat -- wiki/docs/install/changelog.md | awk '{print $2}')
        if [ "${deletions:-0}" -ne 0 ]; then
          echo "::error::Refusing to open a PR that deletes ${deletions} line(s) from the published changelog."
          exit 1
        fi

        BRANCH="chore/changelog-${RELEASE_TAG}"
        git checkout -b "$BRANCH"
        git commit -m "docs(CHANGELOG): add release notes for ${RELEASE_TAG}"
        git push -f origin "$BRANCH"

        if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
          echo "PR for $BRANCH is already open; pushed the update to it."
          exit 0
        fi
        gh pr create \
          --title "docs: changelog for ${RELEASE_TAG}" \
          --body "Adds the ${RELEASE_TAG} release notes to the wiki changelog. Generated by \`.github/workflows/changelog.yml\`; the page is appended to, never rebuilt." \
          --base main \
          --head "$BRANCH"

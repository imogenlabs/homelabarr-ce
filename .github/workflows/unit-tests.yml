name: Unit Tests

# Isolated unit/integration signal: lint + type-check + the vitest suite with
# coverage. Separate from e2e-tests.yml (which runs Playwright against live
# ce-dev). Public repo -> free ubuntu-latest hosted minutes; self-hosted org
# runners are blocked here, so never use runs-on: self-hosted (HLCE-203/204).
# Advisory until made a required status on main (out of scope, HLCE-211).

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [main, dev]

permissions:
  contents: read

# Newer pushes to the same ref supersede in-flight runs.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint, type-check, vitest + coverage
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      # No token: the repo is public, so checkout needs none — and requiring a
      # secret here breaks Dependabot PRs (they run with no access to secrets).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # EOS-2459: not every runner has wget, so a workflow that calls it passes
      # or fails by which machine drew the job. The scripts need only python3.
      - name: Workflows never download with wget
        run: python3 scripts/check-no-wget.py
      - name: That wget gate can actually fire
        run: python3 scripts/check-no-wget.py --self-test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --project tsconfig.app.json --noEmit

      # vitest reads the ratcheting coverage thresholds from vite.config.ts and
      # fails if coverage drops below the floor.
      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

name: README quick start

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install secret file ACL support
        run: sudo apt-get update && sudo apt-get install -y acl
      - name: Build images from this checkout
        run: |
          docker build -f Dockerfile -t ghcr.io/imogenlabs/homelabarr-frontend:latest .
          docker build -f Dockerfile.backend -t ghcr.io/imogenlabs/homelabarr-backend:latest .
      - name: Extract and run README quick start
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          readme = Path('README.md').read_text()
          section = re.search(r'^## (?:Quick start|Install It \(5 minutes\))\s*$([\s\S]*?)(?=^## |\Z)', readme, re.M | re.I)
          if not section:
              raise SystemExit('README quick start section not found')
          block = re.search(r'^```bash\s*\n(.*?)^```', section.group(1), re.M | re.S)
          if not block:
              raise SystemExit('README quick start bash block not found')
          commands = re.sub(r'^git clone .* /opt/homelabarr\s*\n', '', block.group(1), flags=re.M)
          commands = re.sub(r'^cd /opt/homelabarr\s*\n', '', commands, flags=re.M)
          Path('/tmp/readme-quickstart.sh').write_text('set -euo pipefail\n' + commands)
          PY
          bash /tmp/readme-quickstart.sh
      - name: Wait for healthy containers and check login
        shell: bash
        run: |
          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            frontend=$(docker inspect -f '{{.State.Health.Status}}' homelabarr-frontend 2>/dev/null || true)
            backend=$(docker inspect -f '{{.State.Health.Status}}' homelabarr-backend 2>/dev/null || true)
            if [[ "$frontend" == healthy && "$backend" == healthy ]]; then
              break
            fi
            sleep 5
          done
          [[ "$frontend" == healthy && "$backend" == healthy ]] || {
            echo "frontend=$frontend backend=$backend"
            docker ps -a
            exit 1
          }
          curl -f http://localhost:8084/
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          readme = Path('README.md').read_text()
          section = re.search(r'^## (?:Quick start|Install It \(5 minutes\))\s*$([\s\S]*?)(?=^## |\Z)', readme, re.M | re.I)
          match = re.search(r'Log in as `([^`]+)` with the password printed by `scripts/init-secrets.sh`', section.group(1))
          if not match:
            raise SystemExit('README quick start login credentials not found')
          password = Path('secrets/default_admin_password').read_text().strip()
          Path('/tmp/readme-login.json').write_text(json.dumps({'username': match[1], 'password': password}))
          PY
          status=$(curl -sS -o /tmp/readme-login-response -w '%{http_code}' \
            -D /tmp/readme-login-headers -c /tmp/readme-cookies \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/readme-login.json \
            http://localhost:8084/api/auth/login)
          echo "Login HTTP status: $status"
          [[ "$status" =~ ^2[0-9][0-9]$ ]]
          # The README opens the dashboard over plain HTTP. A browser drops a
          # Secure cookie on an http:// page, so a 200 from login alone is not
          # enough: the session cookie must be usable on the next request (#622).
          if grep -i '^set-cookie: hl_session=' /tmp/readme-login-headers | grep -qi '; *secure'; then
            echo "hl_session is marked Secure on a plain-HTTP install; browsers will drop it"
            exit 1
          fi
          if curl -sSI http://localhost:8084/ | grep -i '^content-security-policy:' | grep -q 'upgrade-insecure-requests'; then
            echo "CSP upgrade-insecure-requests is on for a plain-HTTP install; browsers will fail to load assets"
            exit 1
          fi
          me=$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/readme-cookies http://localhost:8084/api/auth/me)
          echo "/api/auth/me with the login cookie: $me"
          [[ "$me" == 200 ]]
      # Usage analytics are on by default and reach PostHog through the
      # dashboard's own nginx. A wrong Host, SNI or path fails silently in a
      # browser, so ask through the proxy here. Neither call records an event.
      - name: Analytics proxy reaches PostHog
        shell: bash
        run: |
          key=$(curl -sS http://localhost:8084/ | grep -o 'name="hl-analytics" content="[^"]*"' | cut -d'"' -f4)
          [[ "$key" == phc_* ]] || { echo "no analytics tag in the served page"; exit 1; }
          settings=$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:8084/ingest/array/$key/config")
          echo "settings through /ingest: $settings"
          [[ "$settings" == 200 ]]
          flags=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            --data "{\"token\":\"$key\",\"distinct_id\":\"ci\"}" 'http://localhost:8084/ingest/flags/?v=2')
          echo "ingest host through /ingest: $flags"
          [[ "$flags" == 200 ]]
      # The proxy must never decide whether the dashboard starts: a host with
      # no working DNS, and one with analytics switched off, both serve it.
      - name: Dashboard starts with no DNS, and with analytics off
        shell: bash
        run: |
          image=ghcr.io/imogenlabs/homelabarr-frontend:latest
          docker run -d --name fe-nodns --dns 192.0.2.1 -p 18081:8080 "$image"
          docker run -d --name fe-off -e ANALYTICS=off -p 18082:8080 "$image"
          for port in 18081 18082; do
            for _ in $(seq 1 30); do
              curl -fsS -o /dev/null "http://localhost:$port/" && break
              sleep 1
            done
          done
          curl -fsS http://localhost:18081/ | grep -q 'name="hl-analytics"' \
            || { echo "no-DNS frontend did not serve the page with its tag"; docker logs fe-nodns; exit 1; }
          if curl -fsS http://localhost:18082/ | grep -q 'hl-analytics'; then
            echo "ANALYTICS=off still serves the analytics tag"; exit 1
          fi
          off=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:18082/ingest/flags/)
          echo "/ingest with analytics off: $off"
          [[ "$off" == 404 ]]
          docker rm -f fe-nodns fe-off
      # Deploying is the dashboard's main job. A deploy is accepted with 200 and
      # then runs in the background, so only a running container proves it
      # worked (#641: every deploy failed on the read-only backend).
      - name: Deploy an app from the catalog
        shell: bash
        run: |
          csrf=$(awk '$6 == "hl_csrf" {print $7}' /tmp/readme-cookies)
          status=$(curl -sS -o /tmp/deploy-response -w '%{http_code}' -b /tmp/readme-cookies \
            -H 'Content-Type: application/json' \
            -H 'X-Requested-With: XMLHttpRequest' \
            -H "X-CSRF-Token: $csrf" \
            --data '{"appId":"self-hosted-it-tools","config":{},"mode":{"type":"standard"}}' \
            http://localhost:8084/api/deploy)
          echo "Deploy HTTP status: $status"
          cat /tmp/deploy-response; echo
          [[ "$status" == 200 ]]
          deadline=$((SECONDS + 180))
          until [[ "$(docker inspect -f '{{.State.Running}}' it-tools 2>/dev/null)" == true ]]; do
            if (( SECONDS > deadline )); then
              echo "it-tools never started. Backend log:"
              docker logs --tail=60 homelabarr-backend 2>&1 | grep -iE 'deploy|erofs|error' || true
              exit 1
            fi
            sleep 5
          done
          echo "it-tools is running"
      # Plain docker, not compose: CORS_ORIGIN was exported inside the README
      # step only, so compose refuses to interpolate here and would hide the logs.
      - name: Show container logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in homelabarr-backend homelabarr-frontend homelabarr-socket-proxy; do
            echo "===== $c"
            docker inspect -f '{{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}' "$c" || true
            docker inspect -f '{{if .State.Health}}{{range .State.Health.Log}}{{.Output}}{{end}}{{end}}' "$c" | tail -5 || true
            docker logs --tail=80 "$c" 2>&1 || true
          done
          echo "===== AppArmor denials (kernel log)"
          sudo dmesg | grep -E 'apparmor="DENIED"' | grep -E 'profile="homelabarr-' | sed -E 's/.*(operation="[^"]*").*(profile="[^"]*").*(name="[^"]*").*(requested_mask="[^"]*").*/\1 \2 \3 \4/' | sort | uniq -c | sort -rn | head -60 || true

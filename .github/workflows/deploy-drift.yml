name: deploy-drift

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const LIVE_URL = 'https://demo.homelabarr.com/';
            const THRESHOLD_MIN = 30;

            const latestRelease = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const releaseDate = new Date(latestRelease.data.published_at);
            const releaseTag = latestRelease.data.tag_name;

            let liveDate = null;
            try {
              const resp = await fetch(LIVE_URL, { method: 'HEAD' });
              const lm = resp.headers.get('last-modified');
              if (lm) liveDate = new Date(lm);
            } catch (e) {
              core.warning(`Could not reach ${LIVE_URL}: ${e.message}`);
              return;
            }

            if (!liveDate) {
              core.warning('No last-modified header on live origin');
              return;
            }

            const driftMin = Math.round((releaseDate - liveDate) / 60000);

            const summary = `| Metric | Value |\n|---|---|\n| Latest release | ${releaseTag} (${releaseDate.toISOString()}) |\n| Live last-modified | ${liveDate.toISOString()} |\n| Drift | ${driftMin} min |\n| Threshold | ${THRESHOLD_MIN} min |\n| Status | ${driftMin > THRESHOLD_MIN ? 'BREACH' : 'OK'} |`;

            await core.summary.addRaw(`## Deploy Drift Check\n\n${summary}`).write();

            if (driftMin > THRESHOLD_MIN) {
              core.setFailed(`Deploy drift: live origin is ${driftMin} min behind latest release ${releaseTag}`);

              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'deploy-drift',
                state: 'open',
              });

              if (existing.data.length === 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `[DRIFT] Live origin is ${driftMin} min behind ${releaseTag}`,
                  body: `Deploy drift detected for release ${releaseTag}.\n\n${summary}\n\nDeploy the pinned release digest on the VPS using /opt/appdata/compose/docker-compose.homelabarr-demo.yml.`,
                  labels: ['deploy-drift'],
                });
              }
            }

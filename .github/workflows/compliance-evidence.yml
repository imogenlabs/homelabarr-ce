name: Compliance evidence collection
on:
  schedule:
    - cron: '0 7 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: Collect compliance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Collect evidence
        env:
          EVIDENCE_HOST: dev.homelabarr.com
        run: |
          chmod +x compliance/collect-evidence.sh
          bash compliance/collect-evidence.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-evidence-${{ github.sha }}
          path: compliance/evidence/
          retention-days: 90

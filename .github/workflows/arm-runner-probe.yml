# THROWAWAY. Proves whether GitHub-hosted arm64 runners are actually available
# to this repo before HLCE-322 rewrites the image build around them. Deleted in
# the same PR that lands the real change.
name: ARM runner probe

on:
  push:
    branches: [HLCE-322-native-arm-build]

permissions:
  contents: read

jobs:
  arm:
    name: arm64 (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    # Fails fast instead of queueing forever if the label does not resolve.
    timeout-minutes: 6
    steps:
      - name: Report what we actually got
        run: |
          echo "uname -m      : $(uname -m)"
          echo "RUNNER_ARCH   : ${RUNNER_ARCH:-unset}"
          echo "docker arch   : $(docker version --format '{{.Server.Arch}}' 2>/dev/null || echo n/a)"
          grep PRETTY_NAME /etc/os-release
          test "$(uname -m)" = "aarch64" || { echo "NOT NATIVE ARM"; exit 1; }
          echo "NATIVE ARM64 CONFIRMED"

  amd:
    name: amd64 (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          echo "uname -m: $(uname -m)"
          echo "RUNNER_ARCH: ${RUNNER_ARCH:-unset}"
